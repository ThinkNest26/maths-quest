<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -70 330 360" width="660" height="720" xmlns:c2pa="http://c2pa.org/manifest"><style>
.bod{animation:bob .9s ease-in-out 0.6s infinite}
.legL{animation:swing .9s ease-in-out 0.6s infinite}
.legR{animation:swing .9s ease-in-out 0.14999999999999997s infinite}
.eyes{animation:blink 4.2s 1.7999999999999998s infinite}
.wave{animation:wave 1.1s ease-in-out infinite}
.flag{transform-origin:210px -45px;animation:flap .7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes flap{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(6deg) scaleX(.85)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
