<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Quest — explorers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23127C8C%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2724%27 fill=%27%23FFF6E6%27/%3E%3Cpath d=%27M32 9L37 32L32 55L27 32Z%27 fill=%27%23F2704E%27/%3E%3Cpath d=%27M9 32L32 27L55 32L32 37Z%27 fill=%27%23FFC845%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sea:#0A86B0;--sea2:#14A9D6;--sky:#E6F8FF;--sand:#FFF9E6;--coral:#FF6B4A;--coral2:#E8502F;--sun:#FFC93C;--leaf:#2DBE6C;--ink:#16323A;--muted:#5B7177;--line:#EADCC0}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#E6F8FF 0,#FFF9E6 420px);font-size:18px;line-height:1.5;min-height:100vh}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;line-height:1.15;margin:0}
button{font-family:Fredoka,sans-serif;font-size:19px;font-weight:600;border:0;border-radius:18px;padding:12px 22px;cursor:pointer;transition:transform .1s}
button:active{transform:translateY(2px)}
button:disabled{opacity:.5;cursor:default}
.b1{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral2)}
.b2{background:#fff;color:var(--sea);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.b3{background:var(--sea2);color:#fff;box-shadow:0 4px 0 var(--sea)}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.top{background:linear-gradient(90deg,#14A9D6,#2EC4B6);color:#fff;box-shadow:0 4px 0 #FFC93C}
.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-family:Fredoka;font-weight:700;font-size:22px;color:#fff;text-decoration:none}
.logo svg{width:38px;height:38px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:800}
.stars{background:var(--sun);color:#5A3D00;border-radius:999px;padding:5px 14px;font-weight:800}
.out{background:transparent;border:2px solid rgba(255,255,255,.5);color:#fff;font-size:15px;padding:6px 14px;box-shadow:none}
.card{background:#fff;border:3px solid var(--line);border-radius:26px;padding:22px}
.center{text-align:center}
.muted{color:var(--muted)}
input.ans,textarea{font:inherit;font-size:26px;font-weight:800;text-align:center;padding:12px 16px;border:3px solid var(--line);border-radius:18px;width:100%;max-width:340px;color:var(--ink);background:#FFFCF6}
textarea{font-size:18px;text-align:left;max-width:100%;font-weight:600}
input.ans:focus,textarea:focus{outline:none;border-color:var(--sea2)}
.msg{margin-top:12px;font-weight:800;min-height:26px}
.bad{color:#B4381B}.ok{color:#1F7A47}
.signin{max-width:520px;margin:30px auto}
.signin svg.z{width:150px;height:150px;display:block;margin:0 auto}
/* map */
/* land */
.stops{display:grid;gap:14px}
.stop{background:#fff;border:3px solid var(--line);border-radius:24px;padding:16px 18px}
.stop h3{font-size:21px;color:var(--sea)}
.qs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qb{font-size:16px;padding:10px 14px;border-radius:14px;background:var(--sky);color:var(--sea);box-shadow:0 3px 0 #BFDDDD}
.qb.done{background:#E3F5EA;color:#1F6B42;box-shadow:0 3px 0 #B7E0C6}
.back{background:transparent;color:var(--sea);box-shadow:none;padding:6px 4px;font-size:17px}
.landhead{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.landhead svg{width:70px;height:70px;flex:0 0 70px}
/* quest */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qhead .f{font-size:22px;color:var(--sea)}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:13px;height:13px;border-radius:50%;background:#E5D9BF;display:block}
.dots i.c{background:var(--leaf)}.dots i.w{background:var(--coral)}.dots i.n{background:var(--sea2)}
.qtext{font-family:Fredoka;font-size:clamp(24px,4.5vw,34px);font-weight:600;color:var(--ink);margin:6px 0 16px}
.pic{background:var(--sky);border:2px dashed #A9DBDB;border-radius:18px;padding:12px 16px;margin:0 auto 14px;max-width:640px;font-weight:700;color:var(--sea);font-size:17px}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.choices button{min-width:110px}
.choices button.sel{background:var(--sea2);color:#fff;box-shadow:0 4px 0 var(--sea)}
.order{min-height:54px;border:3px dashed var(--line);border-radius:16px;padding:8px;margin:10px auto;max-width:640px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hint{background:#FFF3C4;border-radius:16px;padding:12px 16px;margin:12px auto 0;max-width:640px;font-weight:700;color:#6B4E00;display:flex;gap:10px;align-items:center;text-align:left}
.hint svg{width:52px;height:52px;flex:0 0 52px}
.bubble{background:var(--sky);border-radius:20px;padding:16px 18px;font-weight:700;color:var(--sea);font-size:19px}
.steps{display:grid;gap:12px;margin:12px 0}
.step{display:flex;gap:12px;align-items:flex-start;background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 16px;font-weight:700;font-size:19px}
.step b{flex:0 0 38px;height:38px;border-radius:50%;background:var(--sea2);color:#fff;display:grid;place-items:center;font-family:Fredoka}
.timer{height:12px;background:#E5D9BF;border-radius:999px;overflow:hidden;max-width:520px;margin:6px auto 14px}
.timer i{display:block;height:100%;background:var(--sea2);width:100%;transition:width .2s linear}
.big{font-family:Fredoka;font-size:64px;color:var(--sea);font-weight:700}
.cheer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.cheer div{background:#fff;border-radius:28px;padding:22px 34px;box-shadow:0 10px 40px rgba(0,0,0,.18);font-family:Fredoka;font-size:30px;color:var(--leaf);animation:pop .9s ease forwards}
@keyframes pop{0%{transform:scale(.6);opacity:0}20%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.foot{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px}
.foot a{color:var(--sea);font-weight:800}
@media(max-width:600px){body{font-size:17px}.card{padding:16px}.who .nm{display:none}.qtext{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mapbox{position:relative;max-width:760px;margin:0 auto;background:#8ED36B;border-radius:28px;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 26px rgba(20,90,140,.18)}
.mapbox svg.road{display:block;width:100%;height:auto}
.node{cursor:pointer}.node:focus{outline:none}
.node .isl{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.node:hover .isl,.node:focus .isl{transform:scale(1.06) rotate(-1deg)}
.lbl{font-family:Fredoka,Arial;font-weight:700;font-size:24px;fill:#fff;stroke:#8A5A2B;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.prog{font-family:Fredoka,Arial;font-weight:700;font-size:15px;fill:#fff}
.scroll{display:inline-block;background:#FFF6E6;border:3px solid #C98E52;border-radius:16px;padding:6px 26px;box-shadow:0 4px 0 #8A5A2B}
.scroll h1{font-size:30px;color:var(--sea);margin:0}
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.waves{animation:drift 6s ease-in-out infinite}@keyframes drift{50%{transform:translateX(10px)}}
.cloud{animation:cloud 40s linear infinite}.c2{animation-duration:55s;animation-direction:reverse}@keyframes cloud{0%{transform:translateX(-60px)}50%{transform:translateX(60px)}100%{transform:translateX(-60px)}}
.boat{animation:rock 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes rock{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.fish{animation:jump 4s ease-in-out infinite}@keyframes jump{0%,60%,100%{transform:translate(0,20px);opacity:0}70%{opacity:1}80%{transform:translate(24px,-26px) rotate(-20deg);opacity:1}92%{transform:translate(48px,10px) rotate(30deg);opacity:0}}
.spout{animation:spout 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes spout{0%,100%{transform:scaleY(.2);opacity:0}40%,60%{transform:scaleY(1);opacity:1}}
.gull{animation:gull 9s ease-in-out infinite}@keyframes gull{50%{transform:translate(-40px,10px)}}
.glow{animation:glow 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{50%{transform:scale(1.05);opacity:.5}}
.twinkle{animation:tw 1.4s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.fall path{stroke-dasharray:6 4;animation:fall .6s linear infinite}@keyframes fall{to{stroke-dashoffset:-10}}
.bob2{animation:bob 3.2s ease-in-out infinite .8s}.flag{animation:flap 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes flap{50%{transform:skewY(4deg) scaleX(.94)}}
@media (prefers-reduced-motion:reduce){.bob2,.flag,.bob,.waves,.cloud,.boat,.fish,.spout,.gull,.glow,.twinkle,.fall path{animation:none}}
.hero{position:relative;max-width:760px;margin:0 auto;border-radius:24px;overflow:hidden;container-type:inline-size;box-shadow:0 10px 26px rgba(20,90,140,.2)}
.hero img{display:block;width:100%;height:100%}
.mhot{cursor:pointer;border-radius:22px}.mhot:focus-visible{outline:4px solid #FFD23F}
.mhot:hover{background:rgba(255,255,255,.12)}
.mpill{position:absolute;display:flex;align-items:center;justify-content:center;background:#F2483A;color:#fff;border-radius:999px;font-family:Fredoka,Arial;font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);pointer-events:none}
.mpill.ok{background:#2DBE6C}
.ring{position:absolute;border-radius:50%;border:4px dashed #FFD23F;box-shadow:0 0 0 6px rgba(255,210,63,.35);animation:glow 1.6s ease-in-out infinite;pointer-events:none}
.nexttag{position:absolute;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#F2483A;border:3px solid #F2483A;border-radius:999px;padding:.15em .7em;font-family:Fredoka,Arial;font-weight:700;pointer-events:none}
.hprog{position:absolute;transform:translate(-50%,-50%);font-family:Fredoka,Arial;font-weight:800;white-space:nowrap;pointer-events:none}
.pick{border-radius:50%}.pick.yes{animation:popok .6s}.pick.no{animation:shake .4s}
@keyframes popok{50%{transform:scale(1.25);background:rgba(255,255,255,.4)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.extras{max-width:520px;margin:16px auto 0;text-align:center}
.extraland{display:flex;align-items:center;gap:12px;width:100%;background:#F6DDB0;border:6px solid #8E5BD6;border-radius:18px;padding:10px 14px;cursor:pointer;font:inherit}
.extraland .xi svg{width:60px;height:60px}.extraland .xs{flex:1;text-align:left;font-family:Fredoka,Arial;font-weight:700;font-size:26px;color:#1D4E89}
.mpill2{background:#F2483A;color:#fff;border-radius:999px;padding:4px 14px;font-family:Fredoka,Arial;font-weight:700}.mpill2.ok{background:#2DBE6C}
.avbtn{background:none;border:0;padding:0;box-shadow:none;line-height:0;border-radius:50%;cursor:pointer}
.avbtn svg{border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tok{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;box-shadow:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:3;font-family:Fredoka,Arial}
.tokav{line-height:0;display:block;width:100%}.tokav svg{width:100%;height:auto;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 4px #FFD23F,0 8px 16px rgba(0,0,0,.25)}
.tokbub{background:#fff;color:#F2483A;border:3px solid #F2483A;border-radius:999px;padding:.1em .6em;font-weight:700;white-space:nowrap;margin-bottom:.3em}
.tokname{margin-top:.25em;background:#1D4E89;color:#fff;border-radius:999px;padding:.05em .7em;font-weight:700;white-space:nowrap;max-width:140%;overflow:hidden;text-overflow:ellipsis}
.tok.walking .tokav{animation:hop .45s ease-in-out infinite}.tok.walking .tokbub{visibility:hidden}@keyframes hop{50%{transform:translateY(-14%)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.panel{background:#fff;border-radius:24px;padding:20px;border:3px solid var(--line);text-align:center}
.fb.bad{color:#C0392B;font-weight:700;margin:8px 0}
.avfirst{text-align:center;background:linear-gradient(135deg,#E6F8FF,#FFF3C4);border:3px solid #FFD23F;border-radius:24px;padding:16px;margin-bottom:6px}
.avfirst h1{font-size:30px;color:#1D4E89}.avfirst p{margin:6px 0 12px}
.avwrap{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:14px;align-items:start}
.avstage{background:#fff;border:3px solid var(--line);border-radius:28px;padding:18px;text-align:center;position:sticky;top:10px}
.avbig svg{border-radius:50%;border:5px solid #FFD23F;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.avbal{display:inline-block;margin-top:8px;background:#FFD23F;font-family:Fredoka;font-size:22px;padding:6px 16px;border-radius:99px}
.avtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.avtabs button{background:#fff;color:var(--ink);border:3px solid var(--line);padding:8px 14px;font-size:17px;box-shadow:none}
.avtabs button.on{background:#FFD23F;border-color:#FFD23F}
.avsec{text-align:left;margin-bottom:12px;padding:16px}.avsec h3{font-size:20px;margin:0 0 10px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.avopt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);box-shadow:none;font-size:13px;position:relative}
.avopt svg{border-radius:50%}.avopt.on{border-color:#FFD23F;background:#FFF6D6;box-shadow:0 0 0 3px #FFD23F}
.avopt.locked svg{filter:saturate(.55);opacity:.85}
.avn{font-weight:700;font-size:13px;line-height:1.1}
.avprice{background:#F2483A;color:#fff;border-radius:99px;padding:2px 8px;font-size:12.5px;font-weight:800}
.avown{color:#1E9E5A;font-size:12px;font-weight:800}
.swatch{width:48px;height:48px;border-radius:50%;border:3px solid rgba(0,0,0,.08);display:block}
.buybox svg{border-radius:50%;border:4px solid #FFD23F}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pitem{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 10px;color:var(--ink);box-shadow:none;text-align:left;font-size:15px}
.pitem svg{border-radius:50%;flex:none}.pitem .pn{flex:1;font-weight:700}.pitem .pp{font-family:Fredoka;white-space:nowrap}.pitem.own{background:#E3F7EA}
.stopav{display:inline-block;vertical-align:middle;margin-right:6px;line-height:0}.stopav svg{border-radius:50%;border:3px solid #FFD23F}
@media(max-width:760px){.avwrap{grid-template-columns:1fr}
 .avstage{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;padding:10px 12px;border-radius:0 0 22px 22px;box-shadow:0 6px 14px rgba(31,42,68,.12)}
 .avstage .avbig{grid-row:span 3}.avstage .avbig svg{width:96px;height:96px;border-width:3px}
 .avstage>.f{font-size:20px!important;margin:0!important}.avstage .avbal{font-size:16px;margin:0;justify-self:start}
 .avstage .row{margin:0!important;gap:6px;justify-content:flex-start}.avstage .row button{padding:6px 10px;font-size:13px}.avstage>p{display:none}
 .avgrid{grid-template-columns:repeat(3,1fr)}}
.stop.here{border-color:#FFD23F;box-shadow:0 0 0 3px #FFD23F}@media(max-width:480px){.logo{font-size:0!important;gap:0}.logo svg{width:40px;height:40px}}
.logo{white-space:nowrap}.scene{position:relative;margin:-16px calc(50% - 50vw) 0;padding:28px 16px 36px;overflow:hidden;isolation:isolate}
.scene::before{content:'';position:absolute;inset:-60px;background:var(--bg) center/cover no-repeat;filter:blur(30px) saturate(1.25) brightness(1.05);z-index:-1}
.scene .extras{position:relative}
@media(max-width:600px){.scene{padding:0 0 20px}.scene .hero{border-radius:0;box-shadow:none}}
.jwrap{max-width:760px;margin:0 auto 10px;border-radius:24px;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 24px rgba(20,90,140,.18)}
.journey{display:block;width:100%;height:auto}
.jt{font-family:Fredoka,Arial;font-weight:700}
.jpad{cursor:pointer}.jpad:focus{outline:none}.jpad:focus-visible path:first-of-type{stroke:#FFD23F;stroke-width:6}
.jpad.later{opacity:.6}.jpad:hover{opacity:1}
.jpad.cur .jin{animation:bob 1.6s ease-in-out infinite}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.flow{animation:flow 2.5s linear infinite}@keyframes flow{to{stroke-dashoffset:-40}}
#jboat.rowing .bob{animation:bob .5s ease-in-out infinite}
@media(max-width:600px){.jwrap{border-radius:0;border-width:0}}
.jpad.later:hover{opacity:.85}
@media (prefers-reduced-motion:reduce){.jpad.cur .jin,.spin,.flow{animation:none}}
</style>
</head>

function landView(){const l=landObj();
 const J=l.code==='FF'?journeyFF(l):null;
 $('#app').innerHTML=`<button class="back" id="bk">← Quest map</button>${HERO[l.code]?heroHTML(l)+`<h2 class="f" id="stops" style="text-align:center;color:#1D4E89;margin:18px 0 8px">${J?'🚣 Your river journey':'Your stops'}</h2>`:`<div class="landhead">${LANDICON[l.code]}<div><h1 style="font-size:32px;color:var(--sea)">${esc(l.name)}</h1><div class="muted">${l.stops.length} stops · finish every quest to earn the land badge</div></div></div>`}
 ${C.mtc&&l.code==='TT'?`<div class="card" style="margin-bottom:14px;background:#FFF3C4;border-color:#F3D98A"><b class="f" style="font-size:20px">⏱️ Multiplication check practice</b><div class="muted">25 questions, 6 seconds each — just like the real check.</div><button class="b1" id="mtc" style="margin-top:10px">Start a practice check</button></div>`:''}
 ${J?`<div class="jwrap">${J.svg}</div>`:`<div class="stops">${(()=>{const curSt=(l.stops.find(x=>!stopDone(x))||{}).n;return l.stops.map(st=>`<div class="stop${st.n===curSt?' here':''}"><h3>${st.n===curSt?`<span class="stopav">${avatarSVG(myAv(),44)}</span>`:''}${stopDone(st)?'✅ ':''}Stop ${st.n}: ${esc(st.topic)}${st.n===curSt?' <span class="muted" style="font-size:15px">← you are here</span>':''}</h3><div class="qs">${QUESTS.filter(q=>q[0]!=='listen'||st.listen.length).map(q=>`<button class="qb ${isDone(st,q[0])?'done':''}" data-st="${st.n}" data-q="${q[0]}">${isDone(st,q[0])?'✓':q[1]} ${q[2]}</button>`).join('')}</div></div>`).join('')})()}</div>`}`;
 $('#bk').onclick=()=>{V={s:'map'};render()};
 const m=$('#mtc');if(m)m.onclick=()=>{V={s:'listen',land:'TT',stop:0,mtc:true};render()};
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{V={s:b.dataset.q,land:V.land,stop:+b.dataset.st};Q=null;render()});
 if(J)bindJourney(l,J);
 const key2=(el,f)=>{if(!el)return;el.onclick=f;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}};
 key2($('#cta'),()=>{const nq=nextQuest(l);if(nq){V={s:nq[1],land:l.code,stop:nq[0]};Q=null;render();scrollTo(0,0)}else{$('#stops').scrollIntoView({behavior:'smooth'})}});
 key2($('#hm'),()=>{V={s:'map'};render()});
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const ok=b.dataset.pick==='5';praise(ok);b.classList.remove('yes','no');void b.offsetWidth;b.classList.add(ok?'yes':'no');if(ok)cheer('Yes! 5 starfish! ⭐')})}
function stopObj(){return landObj().stops.find(s=>s.n===V.stop)}
function qhead(title,extra){return `<div class="qhead"><button class="back" id="bk">← ${esc(landObj().name)}</button><span class="f">${title}</span>${extra||''}</div>`}
function bindBack(){$('#bk').onclick=()=>{Q=null;V={s:'land',land:V.land};render()}}
async function complete(kind){const st=stopObj();const k=key(st,kind);const {data}=await rpc('mq_complete',{p_code:ME.code,p_key:k,p_kind:kind});
 if(data){ME.stars=data.stars;ME.done=data.done;header();if(data.prize)cheer(`+${data.prize} ⭐ Quest complete!`);else cheer('Quest complete! 🎉')}
 else{ME.done=ME.done||{};ME.done[k]=1}}
function friendSvg(){const f=FRIEND[V.land]||'zaza';const vb={zaza:'0 0 220 220',parrot:'0 0 50 60',owl:'0 0 50 60',turtle:'0 0 70 44',fox:'0 0 60 60'}[f];return `<svg viewBox="${vb}"><use href="#${f}"/></svg>`}
function learnView(){const st=stopObj();
 $('#app').innerHTML=qhead('📖 Learn it')+`<div class="card"><div style="display:flex;gap:14px;align-items:center"><div style="width:90px;flex:0 0 90px">${friendSvg()}</div><div class="bubble">Let's learn: <b>${esc(st.topic)}</b>. Read each step — tap 🔊 to hear it.</div></div>
 <div class="steps">${st.learn.map((s,i)=>`<div class="step"><b>${i+1}</b><div style="flex:1">${esc(s)}</div><button class="b2" data-say="${i}" aria-label="Hear step ${i+1}" style="padding:6px 12px">🔊</button></div>`).join('')}</div>
 <div class="center"><button class="b1" id="got">I've got it! ⭐</button></div></div>`;
 bindBack();document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(st.learn[+b.dataset.say],(st.lk||[])[+b.dataset.say]));
 $('#got').onclick=async()=>{$('#got').disabled=true;await complete('learn');V={s:'practise',land:V.land,stop:V.stop};Q=null;render()}}
/* ---------- practise ---------- */
function pickQs(list,n){const f=ME.facts||{},w=ME.wrong||{};
 const sc=it=>((f[it.id]||0)>=2?100:(f[it.id]||0)*30)-(w[it.id]||0)*20+it.d*3+Math.random()*12;
 return list.slice().sort((a,b)=>sc(a)-sc(b)).slice(0,n).sort((a,b)=>a.d-b.d)}
function splitPic(q){const m=String(q).match(/^\((?:Picture: )?(.*?)\)\s*(.*)$/s);return m&&m[1].length>8?[m[1],m[2]]:[null,q]}
function answerUI(it){
 if(it.t==='choice')return `<div class="choices">${it.c.map(c=>`<button class="b2" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
 if(it.t==='order'){const items=it.a.split(', ').slice().sort(()=>Math.random()-.5);return `<div class="muted">Tap them in order, smallest first.</div><div class="order" id="ord"></div><div class="choices">${items.map(c=>`<button class="b2" data-o="${esc(c)}">${esc(c)}</button>`).join('')}</div><div style="margin-top:10px"><button class="b2" id="clr">Start again</button> <button class="b1" id="chk">Check</button></div>`}
 const ph=it.t==='fraction'?'e.g. 3/4':it.t==='text'?'type your answer':'';
 return `<form id="af"><input class="ans" id="ans" autocomplete="off" inputmode="${it.t==='number'&&!/[a-z(]/i.test(it.a)?'decimal':'text'}" placeholder="${ph}"> <div style="margin-top:12px"><button class="b1">Check</button></div></form>`}
function bindAnswer(it,cb){
 if(it.t==='choice'){document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>cb(b.dataset.c));return}
 if(it.t==='order'){let seq=[];const draw=()=>{$('#ord').innerHTML=seq.map(x=>`<span class="stars" style="background:var(--sky);color:var(--sea)">${esc(x)}</span>`).join('')};
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(!seq.includes(b.dataset.o)){seq.push(b.dataset.o);b.disabled=true;draw()}});
  $('#clr').onclick=()=>{seq=[];document.querySelectorAll('[data-o]').forEach(b=>b.disabled=false);draw()};$('#chk').onclick=()=>cb(seq.join(', '));return}
 const i=$('#ans');i.focus();$('#af').onsubmit=e=>{e.preventDefault();cb(i.value)}}
function practiseView(){const st=stopObj();
 if(!Q){Q={kind:'practise',list:pickQs(st.practise,10),i:0,res:[],tries:0}}
 if(Q.i>=Q.list.length)return finishPractise();
 const it=Q.list[Q.i];const [pic,text]=splitPic(it.q);
 $('#app').innerHTML=qhead('✏️ Practise it',`<div class="dots">${Q.list.map((_,j)=>`<i class="${j<Q.res.length?(Q.res[j]?'c':'w'):j===Q.i?'n':''}"></i>`).join('')}</div>`)+
 `<div class="card center"><div class="muted" style="font-weight:800">Question ${Q.i+1} of ${Q.list.length}</div>${pic?`<div class="pic">🖼️ ${esc(pic)}</div>`:''}<div class="qtext">${esc(text)} <button class="b2" id="hear" aria-label="Hear the question" style="padding:4px 12px;font-size:16px;vertical-align:middle">🔊</button></div>
 ${answerUI(it)}<div class="msg" id="fb"></div><div id="hn"></div></div>`;
 bindBack();$('#hear').onclick=()=>say(text,it.k);
 bindAnswer(it,async g=>{const ok=check(it,g);
  if(ok||Q.tries>=1){if(Q.tries===0){rpc('mq_answer',{p_code:ME.code,p_qid:it.id,p_correct:ok}).then(({data})=>{if(typeof data==='number'){ME.stars=data;header()}});
     ME.facts=ME.facts||{};ME.wrong=ME.wrong||{};if(ok)ME.facts[it.id]=(ME.facts[it.id]||0)+1;else ME.wrong[it.id]=(ME.wrong[it.id]||0)+1}
   Q.res.push(ok&&Q.tries===0);
   if(ok){praise(true);cheer(Q.tries===0?'+1 ⭐ Brilliant!':'Well done! 👍');setTimeout(()=>{Q.i++;Q.tries=0;render()},900)}
   else{$('#fb').innerHTML=`<span class="bad">The answer is <b>${esc(it.a)}</b>.</span> <button class="b3" id="nx" style="margin-left:8px">Next →</button>`;$('#nx').onclick=()=>{Q.i++;Q.tries=0;render()}}
  }else{Q.tries=1;rpc('mq_answer',{p_code:ME.code,p_qid:it.id,p_correct:false});ME.wrong=ME.wrong||{};ME.wrong[it.id]=(ME.wrong[it.id]||0)+1;
   praise(false);$('#fb').innerHTML='<span class="bad">Not quite — try once more!</span>';$('#hn').innerHTML=`<div class="hint">${friendSvg()}<div>${esc(it.h||'Have another think.')}</div></div>`;const i=$('#ans');if(i){i.value='';i.focus()}}
 })}
async function finishPractise(){const n=Q.res.filter(Boolean).length,t=Q.list.length;if(n>=7)say('',n===t?'perfect':'done');
 if(n>=Math.ceil(t*0.7)&&Q.kind==='practise')await complete('practise');
 $('#app').innerHTML=qhead('✏️ Practise it')+`<div class="card center"><div class="big">${n}/${t}</div><h2 style="color:var(--sea);margin:6px 0">${n>=Math.ceil(t*.7)?'Quest complete! 🎉':'Good effort — keep going!'}</h2><p class="muted">${n>=Math.ceil(t*.7)?'Your tricky questions will come back to help you remember.':'Score 7 or more to complete this quest.'}</p>
 <button class="b2" id="again">Practise again</button> <button class="b1" id="on">Back to ${esc(landObj().name)}</button></div>`;
 bindBack();$('#again').onclick=()=>{Q=null;render()};$('#on').onclick=()=>{Q=null;V={s:'land',land:V.land};render()}}
/* ---------- listen and answer ---------- */
let TIMER=null;
function listenView(){clearInterval(TIMER);
 if(V.mtc&&!Q){const set=C.mtc[Math.floor(Math.random()*C.mtc.length)];Q={kind:'mtc',list:set.map((x,i)=>({id:'mtc',q:x.q,a:x.a,t:'number',sec:6})),i:0,res:[]}}
 const st=V.mtc?null:stopObj();if(!Q)Q={kind:'listen',list:st.listen.slice().sort(()=>Math.random()-.5),i:0,res:[]};
 if(Q.i>=Q.list.length){const n=Q.res.filter(Boolean).length,t=Q.list.length;
  if(!V.mtc&&n>=Math.ceil(t*.7))complete('listen');
  $('#app').innerHTML=(V.mtc?`<div class="qhead"><button class="back" id="bk">← Times Table Town</button><span class="f">⏱️ Multiplication check</span></div>`:qhead('🎧 Listen and answer'))+`<div class="card center"><div class="big">${n}/${t}</div><h2 style="color:var(--sea)">${n===t?'Perfect score! 🏆':n>=Math.ceil(t*.7)?'Great listening! 🎉':'Keep practising!'}</h2><button class="b2" id="again">Try again</button></div>`;
  bindBack();$('#again').onclick=()=>{Q=null;render()};return}
 const it=Q.list[Q.i],sec=it.sec||8;
 $('#app').innerHTML=(V.mtc?`<div class="qhead"><button class="back" id="bk">← Times Table Town</button><span class="f">⏱️ Multiplication check</span><div class="dots">${Q.list.map((_,j)=>`<i class="${j<Q.res.length?(Q.res[j]?'c':'w'):j===Q.i?'n':''}"></i>`).join('')}</div></div>`:qhead('🎧 Listen and answer',`<div class="dots">${Q.list.map((_,j)=>`<i class="${j<Q.res.length?(Q.res[j]?'c':'w'):j===Q.i?'n':''}"></i>`).join('')}</div>`))+
 `<div class="card center"><div class="muted" style="font-weight:800">Listen carefully…</div><div class="qtext" id="qt" style="min-height:44px">${V.mtc?esc(it.q)+' = ?':'🎧'}</div><div class="timer"><i id="tb"></i></div>
 <form id="af"><input class="ans" id="ans" autocomplete="off" inputmode="decimal"><div style="margin-top:12px"><button class="b1">Check</button> ${V.mtc?'':'<button type="button" class="b2" id="rp">🔊 Hear again</button>'}</div></form><div class="msg" id="fb"></div></div>`;
 bindBack();const go=()=>{say(it.q,it.k)};setTimeout(go,250);const rp=$('#rp');if(rp)rp.onclick=go;
 let left=sec*10+(V.mtc?0:25);const total=left;const done=(g)=>{clearInterval(TIMER);const ok=check(it,g);Q.res.push(ok);
  if(!V.mtc)rpc('mq_answer',{p_code:ME.code,p_qid:it.id,p_correct:ok}).then(({data})=>{if(typeof data==='number'){ME.stars=data;header()}});
  $('#fb').innerHTML=ok?'<span class="ok">✔ Correct!</span>':`<span class="bad">The answer was <b>${esc(it.a)}</b>.</span>`;if(!V.mtc)$('#qt').textContent=it.q;
  setTimeout(()=>{Q.i++;render()},ok?800:1800)};
 TIMER=setInterval(()=>{left--;const b=$('#tb');if(b)b.style.width=(100*left/total)+'%';if(left<=0)done($('#ans')?$('#ans').value:'')},100);
 $('#ans').focus();$('#af').onsubmit=e=>{e.preventDefault();done($('#ans').value)}}
/* ---------- play it: beat the clock ---------- */
function playView(){clearInterval(TIMER);const st=stopObj();const pool=st.practise.filter(x=>x.t==='number'||x.t==='choice');
 const best=+(localStorage.getItem('mq-best-'+key(st,'play'))||0);
 if(!Q){$('#app').innerHTML=qhead('⏱️ Play it: Beat the clock')+`<div class="card center"><div style="width:120px;margin:0 auto">${friendSvg()}</div><h2 style="color:var(--sea)">How many can you get right in 60 seconds?</h2><p class="muted">Your best: <b>${best}</b></p><button class="b1" id="go" style="font-size:24px">Start! ⏱️</button></div>`;bindBack();$('#go').onclick=()=>{Q={kind:'play',score:0,left:600,cur:null};render()};return}
 if(Q.left<=0){const s=Q.score;if(s>best)try{localStorage.setItem('mq-best-'+key(st,'play'),s)}catch(e){}
  if(s>=3)complete('play');
  $('#app').innerHTML=qhead('⏱️ Play it: Beat the clock')+`<div class="card center"><div class="big">${s}</div><h2 style="color:var(--sea)">${s>best?'New best score! 🏆':'Time\'s up!'}</h2><p class="muted">Best: ${Math.max(s,best)}</p><button class="b1" id="again">Play again</button></div>`;bindBack();$('#again').onclick=()=>{Q=null;render()};return}
 Q.cur=pool[Math.floor(Math.random()*pool.length)];const it=Q.cur;const [pic,text]=splitPic(it.q);
 $('#app').innerHTML=qhead('⏱️ Play it',`<span class="stars" style="margin-left:auto">Score: ${Q.score}</span>`)+`<div class="card center"><div class="timer"><i id="tb" style="width:${Q.left/6}%"></i></div>${pic?`<div class="pic">🖼️ ${esc(pic)}</div>`:''}<div class="qtext">${esc(text)}</div>${answerUI(it)}<div class="msg" id="fb"></div></div>`;
 bindBack();clearInterval(TIMER);TIMER=setInterval(()=>{if(!Q||V.s!=='play'){clearInterval(TIMER);return}Q.left--;const b=$('#tb');if(b)b.style.width=(Q.left/6)+'%';if(Q.left<=0){clearInterval(TIMER);render()}},100);
 bindAnswer(it,g=>{if(check(it,g)){Q.score++;cheer('✔',null)}else{$('#fb').innerHTML=`<span class="bad">${esc(it.a)}</span>`}setTimeout(()=>{if(Q&&Q.left>0)render()},check(it,g)?250:900)})}
/* ---------- think it ---------- */
function thinkView(){const st=stopObj();if(!Q){const p=st.think[Math.floor(Math.random()*st.think.length)];Q={kind:'think',p,shown:false}}
 const p=Q.p,ty=String(p.type||'');let ui;
 const tf=/true or false/i.test(ty),asn=/always/i.test(ty);
 if(tf)ui=`<div class="choices"><button class="b2" data-t="true">True</button><button class="b2" data-t="false">False</button></div>`;
 else if(asn)ui=`<div class="choices"><button class="b2" data-t="always">Always</button><button class="b2" data-t="sometimes">Sometimes</button><button class="b2" data-t="never">Never</button></div>`;
 else ui=`<textarea id="ex" rows="3" placeholder="Explain your thinking…"></textarea><div style="margin-top:10px"><button class="b1" id="rev">Show the answer</button></div>`;
 $('#app').innerHTML=qhead('🤔 Think it')+`<div class="card center"><div class="stars" style="display:inline-block;background:var(--sun)">${esc(ty)}</div><div class="qtext">${esc(p.q)} <button class="b2" id="hear" style="padding:4px 12px;font-size:16px;vertical-align:middle">🔊</button></div>${ui}<div class="msg" id="fb"></div><div id="ans"></div></div>`;
 bindBack();$('#hear').onclick=()=>say(p.q,p.k);
 const reveal=(good)=>{$('#ans').innerHTML=`<div class="hint">${friendSvg()}<div><b>${fname()} says:</b> ${esc(p.a)}<br><span class="muted" style="font-weight:600">The important part is explaining <i>why</i>.</span></div></div><div style="margin-top:14px">${good===undefined?'<button class="b1" id="gotit">I got it ✓</button> <button class="b2" id="notyet">Not yet</button>':'<button class="b1" id="gotit">Finish ✓</button> <button class="b2" id="another">Another puzzle</button>'}</div>`;
  $('#gotit').onclick=async()=>{await complete('think');Q=null;V={s:'land',land:V.land};render()};const n=$('#notyet')||$('#another');if(n)n.onclick=()=>{Q=null;render()}};
 if(tf||asn){document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const ok=norm(p.a).startsWith(b.dataset.t);$('#fb').innerHTML=ok?'<span class="ok">✔ Yes! Now can you explain why?</span>':'<span class="bad">Not quite — look at Zaza\'s answer.</span>';document.querySelectorAll('[data-t]').forEach(x=>x.disabled=true);reveal(ok)})}
 else $('#rev').onclick=()=>{reveal()}}
/* ---------- use it ---------- */
function useView(){const st=stopObj();if(!Q){const p=st.use[Math.floor(Math.random()*st.use.length)];Q={kind:'use',p}}
 const p=Q.p,num=firstNum(p.a)&&!/answers will vary|e\.g\./i.test(p.a)&&!/,.*\d/.test(p.a.replace(/,(?=\d{3})/g,''));
 $('#app').innerHTML=qhead('🌍 Use it')+`<div class="card center"><div style="width:110px;margin:0 auto">${friendSvg()}</div><div class="qtext">${esc(p.q)} <button class="b2" id="hear" style="padding:4px 12px;font-size:16px;vertical-align:middle">🔊</button></div>
 ${num?`<form id="af"><input class="ans" id="ans" autocomplete="off"><div style="margin-top:12px"><button class="b1">Check</button></div></form>`:`<textarea id="ex" rows="3" placeholder="Work it out and write your answer…"></textarea><div style="margin-top:10px"><button class="b1" id="rev">Show the answer</button></div>`}<div class="msg" id="fb"></div><div id="ans2"></div></div>`;
 bindBack();$('#hear').onclick=()=>say(p.q,p.k);
 const fin=()=>{$('#ans2').innerHTML+=`<div style="margin-top:14px"><button class="b1" id="gotit">Finish ✓</button> <button class="b2" id="another">Another problem</button></div>`;$('#gotit').onclick=async()=>{await complete('use');Q=null;V={s:'land',land:V.land};render()};$('#another').onclick=()=>{Q=null;render()}};
 if(num){let tries=0;$('#af').onsubmit=e=>{e.preventDefault();const g=$('#ans').value;const ok=check({a:firstNum(p.a)},firstNum(g)||g);
   if(ok){$('#fb').innerHTML=`<span class="ok">✔ Correct! ${esc(p.a)}</span>`;cheer('Brilliant! 🌍');$('#af').querySelector('button').disabled=true;fin()}
   else if(++tries<2){$('#fb').innerHTML='<span class="bad">Not quite — check your working and try again.</span>'}
   else{$('#fb').innerHTML=`<span class="bad">The answer is <b>${esc(p.a)}</b>.</span>`;$('#af').querySelector('button').disabled=true;$('#ans2').innerHTML='<div style="margin-top:12px"><button class="b2" id="another">Try another problem</button></div>';$('#another').onclick=()=>{Q=null;render()}}}}
 else $('#rev').onclick=()=>{$('#ans2').innerHTML=`<div class="hint">${friendSvg()}<div><b>${fname()} says:</b> ${esc(p.a)}</div></div>`;fin()}}
/* ---------- start ---------- */
(async()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(saved&&saved.code){$('#app').innerHTML='<p class="center muted">Opening your map…</p>';const m=await signIn(saved.code);if(m){ME=null;render()}}else render()})();
</script>
