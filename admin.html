<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maths Quest · Admin</title><meta name="description" content="ThinkNest admin for Maths Quest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sea:#127C8C;--navy:#1D3A5F;--muted:#5B7177;--coral:#F2704E;--gold:#F7B538;--line:#EFE6D2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Nunito,Arial,sans-serif;background:linear-gradient(180deg,#DDF0FA 0,#FFF8EA 420px);color:#1D2B36;font-weight:700;line-height:1.55}
.f,h1,h2,h3{font-family:Fredoka,Arial,sans-serif;color:var(--navy);line-height:1.2}
header{background:#fff;box-shadow:0 2px 12px rgba(20,60,90,.08)}header .w{max-width:1040px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:Fredoka;font-weight:700;font-size:22px;color:var(--navy);text-decoration:none}.logo svg{width:36px;height:36px}.sp{flex:1}
header a.back{color:var(--sea);font-weight:800;text-decoration:none}
main{max-width:1040px;margin:0 auto;padding:24px 18px 40px}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:0 6px 18px rgba(20,60,90,.05)}
label{display:block;font-size:14px;font-weight:800;color:var(--navy);margin:12px 0 4px}
input,select,textarea{font:700 16px Nunito,Arial;border:2px solid #DCE8F0;border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:#1D2B36}
input:focus,select:focus,textarea:focus{outline:3px solid #FFE3A0;border-color:var(--gold)}
.btn{border:0;border-radius:999px;padding:13px 24px;font:700 18px Fredoka,Arial;cursor:pointer;text-decoration:none;display:inline-block;background:var(--gold);color:var(--navy);box-shadow:0 4px 0 #D9932A}.btn:disabled{opacity:.5}
.b2{background:#fff;color:var(--sea);border:2px solid #E3D9C2;box-shadow:none}.sm{padding:7px 14px;font-size:14px}
.muted{color:var(--muted)}.small{font-size:13px}
.msg{display:none;margin-top:12px;padding:12px;border-radius:12px}.msg.show{display:block}.msg.bad{background:#FDE8E3;color:#9B2C12}.msg.ok{background:#E2F6EA;color:#166534}
footer{text-align:center;color:var(--muted);font-size:14px;padding:22px}footer a{color:var(--sea)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.tabs button{border:2px solid #E3D9C2;background:#fff;border-radius:999px;padding:8px 16px;font:700 15px Fredoka;color:var(--navy);cursor:pointer}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}.stat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;font:700 28px Fredoka;color:var(--sea)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;padding:6px}td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}.p-trial{background:#E6F0FF;color:#1D4E89}.p-standard{background:#E2F6EA;color:#166534}.p-premium{background:#FFF3C4;color:#7A5600}.p-none{background:#EEE;color:#555}.p-ended{background:#FDE3DD;color:#9B2C12}
.modal{position:fixed;inset:0;background:rgba(15,40,70,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.modal .card{max-width:520px;width:100%}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px}
input.inl{width:110px;padding:6px 8px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="logo" viewBox="0 0 64 64">
 <circle cx="32" cy="32" r="30" fill="#127C8C"/><circle cx="32" cy="32" r="24" fill="#FFF6E6"/><circle cx="32" cy="32" r="24" fill="none" stroke="#0E5E6F" stroke-width="2" stroke-dasharray="3 4"/>
 <path d="M32 9 L37 32 L32 55 L27 32Z" fill="#F2704E"/><path d="M32 32 L37 32 L32 55 L27 32Z" fill="#0E5E6F"/>
 <path d="M9 32 L32 27 L55 32 L32 37Z" fill="#FFC845" opacity=".95"/>
 <circle cx="32" cy="32" r="4.5" fill="#fff" stroke="#0E5E6F" stroke-width="2"/>
 <text x="32" y="20.5" text-anchor="middle" font-family="Fredoka,Arial" font-weight="700" font-size="9" fill="#fff">+</text>
 <text x="45" y="35.5" text-anchor="middle" font-family="Fredoka,Arial" font-weight="700" font-size="9" fill="#7A5600">×</text>
 <text x="19" y="35.5" text-anchor="middle" font-family="Fredoka,Arial" font-weight="700" font-size="9" fill="#7A5600">−</text>
 <text x="32" y="49" text-anchor="middle" font-family="Fredoka,Arial" font-weight="700" font-size="9" fill="#fff">÷</text>
</symbol></defs></svg>
<header><div class="w"><a class="logo" href="./"><svg aria-hidden="true"><use href="#logo"/></svg>Maths Quest</a><span class="muted">· Admin</span><div class="sp"></div><span id="who" class="small muted"></span></div></header>
<main id="app"><p>Loading…</p></main><div id="modal"></div>
<footer><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="mailto:hello@school-mathquest.com">hello@school-mathquest.com</a><br>Powered by <b>ThinkNest</b> · Maths Quest is independent and is not affiliated with or endorsed by any test publisher.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xpbkdnkfufkahaszfycd.supabase.co',SUPABASE_KEY='sb_publishable_QIAV_9tLUBbDCu7FHqaTEw_zYQ0teEG';
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null,TAB='schools',Q='';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai'}).format(new Date());
const fd=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function login(m){$('#who').innerHTML='';$('#app').innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h2 style="margin:0 0 6px">Admin sign in</h2><form id="lf"><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div style="margin-top:14px"><button class="btn" style="width:100%">Sign in</button></div></form><div class="msg bad ${m?'show':''}">${esc(m||'')}</div></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error){login('That email or password is not right.');return}start()}}
async function start(){if(!sb){login('Could not connect.');return}const {data:{session}}=await sb.auth.getSession();if(!session){login();return}
 $('#who').innerHTML=esc(session.user.email)+' · <a href="#" id="so">Sign out</a>';$('#so').onclick=async e=>{e.preventDefault();await sb.auth.signOut();login()};
 const {data,error}=await sb.rpc('mq_admin_overview');if(error||!data||data.error){$('#app').innerHTML='<div class="card">This page is only for the ThinkNest admin account.</div>';return}D=data;render()}
function status(s){if(!s.mq_plan)return '<span class="pill p-none">No Maths Quest</span>';const left=s.mq_until?Math.round((Date.parse(s.mq_until)-Date.parse(today()))/864e5):null;
 if(left!==null&&left<0)return `<span class="pill p-ended">${esc(s.mq_plan)} · ended</span>`;return `<span class="pill p-${esc(s.mq_plan)}">${esc(s.mq_plan)}</span> <span class="small muted">${left===null?'':left+' days left'}</span>`}
function render(){const S=D.schools||[],R=(D.requests||[]),I=(D.interest||[]),tdy=today();
 const on=S.filter(s=>s.mq_plan&&s.mq_until>=tdy),trial=on.filter(s=>s.mq_plan==='trial'),paid=on.filter(s=>s.mq_plan!=='trial');
 const kids=on.reduce((a,s)=>a+ +s.children,0),act=on.reduce((a,s)=>a+ +s.active_week,0);const prices={};(D.plans||[]).forEach(p=>prices[p.id]=p.price);const income=paid.reduce((a,s)=>a+(prices[s.mq_plan]||0),0);
 const newR=R.filter(r=>r.status==='new').length,newI=I.filter(i=>i.status==='new').length;
 let body='';
 if(TAB==='schools'){const L=S.filter(s=>!Q||(s.name+' '+s.contact_email+' '+s.city+' '+s.contact_name).toLowerCase().includes(Q));
  body=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Schools</h2><div class="sp"></div><input id="q" placeholder="Search school, email or city" value="${esc(Q)}" style="max-width:280px"><button class="btn b2 sm" id="csv">⬇ CSV</button></div>
  <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>School</th><th>Contact</th><th>Maths Quest</th><th>Until</th><th>Children</th><th>Active (7 days)</th><th>Last active</th><th></th></tr></thead><tbody>
  ${L.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="small muted">${esc(s.city||'')} · joined ${fd(s.created_at)}</div></td><td>${esc(s.contact_name||'')}<div class="small"><a href="mailto:${esc(s.contact_email)}">${esc(s.contact_email||'')}</a> ${esc(s.contact_phone||'')}</div></td><td>${status(s)}</td><td>${fd(s.mq_until)}</td><td>${s.children}</td><td>${s.active_week}</td><td>${fd(s.last_active)}</td><td><button class="btn b2 sm" data-set="${s.id}">Change plan</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">No schools.</td></tr>'}</tbody></table></div></div>`}
 if(TAB==='requests')body=`<div class="card"><h2 style="margin:0 0 8px">Plan requests</h2><table><thead><tr><th>When</th><th>School</th><th>Plan</th><th>Note</th><th>From</th><th></th></tr></thead><tbody>${R.map(r=>`<tr style="${r.status==='done'?'opacity:.55':''}"><td>${fd(r.at)}</td><td><b>${esc(r.school)}</b></td><td><span class="pill p-${esc(r.plan)}">${esc(r.plan)}</span> <span class="small muted">$${(prices[r.plan]||0).toLocaleString('en-US')}</span></td><td>${esc(r.note)}</td><td class="small">${esc(r.by)}</td><td>${r.status==='new'?`<button class="btn sm" data-give="${r.school_id}|${r.plan}">Give plan</button> <button class="btn b2 sm" data-rdone="${r.id}">Done</button>`:'✔ Done'}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No requests yet.</td></tr>'}</tbody></table></div>`;
 if(TAB==='interest')body=`<div class="card"><h2 style="margin:0 0 8px">Interest from the landing page</h2><table><thead><tr><th>When</th><th>School</th><th>Name and role</th><th>Email</th><th>Note</th><th>Status</th></tr></thead><tbody>${I.map(i=>`<tr><td>${fd(i.created_at)}</td><td><b>${esc(i.school)}</b><div class="small muted">${esc(i.city||'')}</div></td><td>${esc(i.name)}<div class="small muted">${esc(i.role||'')}</div></td><td><a href="mailto:${esc(i.email)}">${esc(i.email)}</a><div class="small">${esc(i.phone||'')}</div></td><td class="small">${esc(i.note||'')}</td><td><select data-int="${i.id}" style="width:auto">${['new','contacted','done'].map(v=>`<option ${v===i.status?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No interest yet.</td></tr>'}</tbody></table></div>`;
 if(TAB==='prices')body=`<div class="card"><h2 style="margin:0 0 4px">Maths Quest prices</h2><p class="small muted">Per school, per year. Teachers see these when they choose a plan.</p>${(D.plans||[]).map(p=>`<div class="card" style="margin:10px 0;box-shadow:none"><b class="f" style="font-size:20px">${esc(p.name)}</b><label>Price (US dollars per year)</label><input type="number" min="0" id="pr-${p.id}" value="${p.price}" style="max-width:160px"><label>Short description</label><input id="pb-${p.id}" value="${esc(p.blurb)}" maxlength="120"><label>Features (one per line)</label><textarea id="pf-${p.id}" rows="6">${esc((p.features||[]).join('\n'))}</textarea><div style="margin-top:10px"><button class="btn sm" data-price="${p.id}">Save ${esc(p.name)}</button></div></div>`).join('')}</div>`;
 $('#app').innerHTML=`<div class="stats"><div class="stat"><b>${on.length}</b>schools using Maths Quest</div><div class="stat"><b>${trial.length}</b>on a free trial</div><div class="stat"><b>${paid.length}</b>paying</div><div class="stat"><b>$${income.toLocaleString('en-US')}</b>US dollars a year</div><div class="stat"><b>${kids}</b>children with codes</div><div class="stat"><b>${act}</b>active this week</div></div>
  <div class="tabs">${[['schools','🏫 Schools'],['requests',`🧾 Plan requests${newR?' ('+newR+')':''}`],['interest',`✉️ Interest${newI?' ('+newI+')':''}`],['prices','💷 Prices']].map(([k,l])=>`<button class="${TAB===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>${body}`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});
 const q=$('#q');if(q)q.oninput=e=>{Q=e.target.value.toLowerCase();const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
 document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>planModal(S.find(s=>s.id===b.dataset.set)));
 document.querySelectorAll('[data-give]').forEach(b=>b.onclick=()=>{const [id,pl]=b.dataset.give.split('|');planModal(S.find(s=>s.id===id),pl)});
 document.querySelectorAll('[data-rdone]').forEach(b=>b.onclick=async()=>{await sb.rpc('mq_admin_request_done',{p_id:+b.dataset.rdone});start()});
 document.querySelectorAll('[data-int]').forEach(x=>x.onchange=async()=>{const {data}=await sb.rpc('mq_admin_interest',{p_id:+x.dataset.int,p_status:x.value});toast(data&&data.ok?'Saved':'Could not save')});
 document.querySelectorAll('[data-price]').forEach(b=>b.onclick=async()=>{const id=b.dataset.price;const {data}=await sb.rpc('mq_admin_set_price',{p_plan:id,p_price:+$('#pr-'+id).value||0,p_blurb:$('#pb-'+id).value,p_features:$('#pf-'+id).value.split('\n').map(x=>x.trim()).filter(Boolean)});toast(data&&data.ok?'Saved':'Could not save');start()});
 const c=$('#csv');if(c)c.onclick=()=>{const qq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const L=[['School','City','Contact','Email','Phone','Maths Quest plan','Until','Children','Active 7 days','Last active','Joined'].map(qq).join(',')].concat(S.map(s=>[s.name,s.city,s.contact_name,s.contact_email,s.contact_phone,s.mq_plan||'',s.mq_until||'',s.children,s.active_week,s.last_active||'',s.created_at].map(qq).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));a.download='maths-quest-schools-'+today()+'.csv';a.click()}}
function planModal(s,pre){if(!s)return;const d=new Date();const yEnd=(d.getMonth()>=7?d.getFullYear()+1:d.getFullYear())+'-07-31';
 $('#modal').innerHTML=`<div class="modal"><div class="card"><h2 style="margin:0 0 6px">${esc(s.name)}</h2><p class="small muted">Now: ${status(s)}</p>
  <label>Maths Quest plan</label><select id="mp"><option value="">No Maths Quest (turn off)</option>${['trial','standard','premium'].map(p=>`<option value="${p}" ${(pre||s.mq_plan)===p?'selected':''}>${p}</option>`).join('')}</select>
  <label>Active until</label><input type="date" id="mu" value="${(pre&&pre!=='trial')?yEnd:(s.mq_until||yEnd)}"><p class="small muted">Tip: paid plans usually run to 31 July (end of the school year).</p>
  <div style="display:flex;gap:10px;margin-top:14px"><div class="sp"></div><button class="btn b2" id="mc">Cancel</button><button class="btn" id="ms">Save</button></div></div></div>`;
 $('#mc').onclick=()=>$('#modal').innerHTML='';$('#ms').onclick=async()=>{const pl=$('#mp').value||null,u=$('#mu').value||null;if(pl&&!u){toast('Choose a date');return}
  const {data}=await sb.rpc('mq_admin_set_plan',{p_school:s.id,p_plan:pl,p_until:u});$('#modal').innerHTML='';toast(data&&data.ok?'Plan saved':'Could not save');start()}}
start();
</script></body></html>
