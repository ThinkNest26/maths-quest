:root{--sea:#0E5E6F;--sea2:#127C8C;--sky:#E3F4F4;--sand:#FFF6E6;--coral:#F2704E;--coral2:#D9553A;--sun:#FFC845;--leaf:#3FA06B;--ink:#16323A;--muted:#5B7177;--line:#EADCC0}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--sand);font-size:16px}

main{max-width:1150px;margin:0 auto;padding:18px 16px}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
input,select,textarea{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:#FFFCF6;width:100%}
label{font-weight:800;font-size:13px;display:block;margin:10px 0 4px}

table{width:100%;border-collapse:collapse;font-size:14.5px}th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}td{padding:8px;border-bottom:1px solid #F4EEDC}

   const rows=names.map(n=>({first_name:n.charAt(0).toLocaleUpperCase()+n.slice(1),grade:cls.grade,class_name:cls.name}));const n=await insertKids(rows,$('#am'));if(n){$('#modal').innerHTML='';render();toast(n+' children added to '+cls.name)}}};
 const mv=$('#clmove');if(mv)mv.onclick=()=>{$('#modal').innerHTML=`<div class="modal"><div class="card"><h2 style="color:var(--sea)">Move children into ${esc(cls.name)}</h2><p class="muted small">${GL(cls.grade)} children who are not in ${esc(cls.name)}.</p><div class="picklist">${others.map(k=>`<label><input type="checkbox" value="${k.id}"> ${esc(k.first_name)} <span class="muted small">${k.class_name?esc(k.class_name):'no class'}</span></label>`).join('')}</div><div class="row" style="margin-top:12px"><div class="spacer"></div><button class="b2" id="ac">Cancel</button><button class="b1" id="ao">Move</button></div></div></div>`;
  $('#ac').onclick=()=>$('#modal').innerHTML='';$('#ao').onclick=async()=>{const ids=[...document.querySelectorAll('.picklist input:checked')].map(i=>i.value);if(!ids.length)return;for(const id of ids){const {error}=await sb.from('mq_students').update({class_name:cls.name}).eq('id',id);if(!error)KIDS.find(k=>k.id===id).class_name=cls.name}$('#modal').innerHTML='';render();toast(ids.length+' moved')}};
 $('#cldel').onclick=async()=>{if(!confirm(`Delete class ${cls.name}? The children keep their codes and progress but will not be in a class.`))return;
  for(const k of ks)await sb.from('mq_students').update({class_name:''}).eq('id',k.id);ks.forEach(k=>k.class_name='');const {error}=await sb.from('mq_classes').delete().eq('id',cls.id);if(error){toast('Could not delete');return}CLASSES=CLASSES.filter(c=>c.id!==cls.id);SELCLASS=null;render();toast('Class deleted')}}
/* ----- tasks ----- */
function taskKids(t){return t.student_ids&&t.student_ids.length?KIDS.filter(k=>t.student_ids.includes(k.id)):KIDS.filter(k=>k.grade===t.grade&&k.class_name===t.class_name)}
function taskDoneBy(t,k){const d=(PROG[k.id]||{}).done||{};return t.kinds.every(q=>d[`G${t.grade}-${t.land}-${t.stop}-${q}`])}
function topicOf(t){const c=CONT[t.grade];if(!c)return 'Stop '+t.stop;const l=c.lands.find(x=>x.code===t.land);const s=l&&l.stops.find(x=>x.n===t.stop);return s?s.topic:'Stop '+t.stop}
function taskList(tasks){if(!tasks.length)return '<p class="muted">No tasks yet.</p>';
 return tasks.map(t=>{const ks=taskKids(t),dn=ks.filter(k=>taskDoneBy(t,k)),left=ks.filter(k=>!taskDoneBy(t,k)),pc=ks.length?Math.round(100*dn.length/ks.length):0,late=t.due&&t.due<new Date().toISOString().slice(0,10)&&left.length;
  return `<div class="tk"><div class="row"><span style="font-size:26px">${LANDE[t.land]}</span><div style="flex:1;min-width:200px"><b>${esc(topicOf(t))}</b> <span class="muted small">· ${LANDN2[t.land]} · Stop ${t.stop}</span><div class="small">${t.kinds.map(q=>KINDN[q]).join(' · ')}${t.due?` · due <b style="color:${late?'#B23A1E':'inherit'}">${new Date(t.due+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</b>`:''}</div>${t.note?`<div class="small muted">“${esc(t.note)}”</div>`:''}</div>
  <div style="min-width:170px"><div class="small"><b>${dn.length}/${ks.length}</b> done · ${t.student_ids&&t.student_ids.length?`${ks.length} child${ks.length>1?'ren':''}`:`class ${esc(t.class_name)}`}</div><div class="bar" style="width:160px"><i style="width:${pc}%"></i></div></div><button class="sm b2" data-tdel="${t.id}">Delete</button></div>
  ${left.length&&left.length<ks.length+1?`<div class="small muted" style="margin-top:4px">Still to do: ${left.map(k=>esc(k.first_name)).join(', ')}</div>`:''}</div>`}).join('')}
function bindTaskList(){document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this task?'))return;const {error}=await sb.from('mq_tasks').delete().eq('id',b.dataset.tdel);if(error){toast('Could not delete');return}TASKS=TASKS.filter(t=>t.id!==b.dataset.tdel);render()})}
async function renderTasks(){$('#app').innerHTML=tabsBar()+'<div class="card">Loading…</div>';bindTabsT();
 await Promise.all([...new Set(TASKS.map(t=>t.grade).concat(KIDS.map(k=>k.grade)))].map(g=>content(g)));if(TV!=='tasks')return;
 $('#app').innerHTML=tabsBar()+`<div class="card"><div class="row"><h2 style="color:var(--sea);font-size:22px">📝 Tasks</h2><div class="spacer"></div><button class="b2" id="tsug">✨ Suggest tasks from progress</button><button class="b1" id="tnew">+ New task</button></div>
  <p class="muted small" style="margin:6px 0 12px">Set quests for a whole class or for chosen children. Children see their tasks at the top of their map, and you can see who has finished.</p>${taskList(TASKS)}</div>`;
 bindTabsT();bindTaskList();$('#tnew').onclick=()=>taskModal({});$('#tsug').onclick=suggestModal}
async function taskModal(pre){const grades=[...new Set(KIDS.map(k=>k.grade))].sort();let g=pre.grade!=null?pre.grade:grades[0];if(g==null){toast('Add children first');return}
 const draw=async()=>{const cont=await content(g);const cls=CLASSES.filter(c=>c.grade===g);const kids=KIDS.filter(k=>k.grade===g).sort((a,b)=>(a.class_name+a.first_name).localeCompare(b.class_name+b.first_name));
  const land=pre.land||cont.lands[0].code,L=cont.lands.find(x=>x.code===land)||cont.lands[0],stop=pre.stop||L.stops[0].n,S=L.stops.find(s=>s.n===stop)||L.stops[0];
  const who=pre.ids?'pick':(pre.class_name!=null?pre.class_name:(cls[0]?cls[0].name:'pick'));const kinds=pre.kinds||['practise'];
  $('#modal').innerHTML=`<div class="modal"><div class="card" style="max-width:640px"><h2 style="color:var(--sea)">📝 New task</h2>
  <div class="tgrid"><div><label>Grade</label><select id="tg">${grades.map(x=>`<option value="${x}" ${x===g?'selected':''}>${GL(x)}</option>`).join('')}</select></div>
  <div><label>For</label><select id="tw">${cls.map(c=>`<option value="${esc(c.name)}" ${who===c.name?'selected':''}>Class ${esc(c.name)}</option>`).join('')}<option value="pick" ${who==='pick'?'selected':''}>Choose children…</option></select></div>
  <div><label>Land</label><select id="tl">${cont.lands.map(x=>`<option value="${x.code}" ${x.code===L.code?'selected':''}>${LANDE[x.code]} ${esc(x.name)}</option>`).join('')}</select></div>
  <div><label>Topic</label><select id="ts">${L.stops.map(s=>`<option value="${s.n}" ${s.n===S.n?'selected':''}>Stop ${s.n}: ${esc(s.topic)}</option>`).join('')}</select></div></div>
  <div id="twp" style="${who==='pick'?'':'display:none'}"><label>Children</label><div class="picklist">${kids.map(k=>`<label><input type="checkbox" value="${k.id}" ${(pre.ids||[]).includes(k.id)?'checked':''}> ${esc(k.first_name)} <span class="muted small">${esc(k.class_name||'')}</span></label>`).join('')}</div></div>
  <label>Quests to do</label><div class="row" style="gap:6px">${['learn','practise'].concat(S.listen.length?['listen']:[]).concat(['play','think','use']).map(q=>`<label class="qchk"><input type="checkbox" value="${q}" ${kinds.includes(q)?'checked':''}> ${KINDN[q]}</label>`).join('')}</div>
  <div class="tgrid"><div><label>Due date (optional)</label><input type="date" id="td" value="${pre.due||''}"></div><div><label>Note for children (optional)</label><input id="tn" maxlength="300" value="${esc(pre.note||'')}" placeholder="e.g. Try your best!"></div></div>
  <div class="msg bad" id="tm"></div><div class="row" style="margin-top:12px"><div class="spacer"></div><button class="b2" id="tc">Cancel</button><button class="b1" id="tok">Set task</button></div></div></div>`;
  const keep=()=>{pre.kinds=[...document.querySelectorAll('.qchk input:checked')].map(i=>i.value);pre.due=$('#td').value;pre.note=$('#tn').value;pre.ids=$('#tw').value==='pick'?[...document.querySelectorAll('#twp input:checked')].map(i=>i.value):null;pre.class_name=$('#tw').value==='pick'?null:$('#tw').value};
  $('#tg').onchange=e=>{keep();g=+e.target.value;pre.land=null;pre.stop=null;pre.ids=null;pre.class_name=null;draw()};$('#tl').onchange=e=>{keep();pre.land=e.target.value;pre.stop=null;draw()};$('#ts').onchange=e=>{keep();pre.land=$('#tl').value;pre.stop=+e.target.value;draw()};
  $('#tw').onchange=e=>{$('#twp').style.display=e.target.value==='pick'?'':'none'};$('#tc').onclick=()=>$('#modal').innerHTML='';
  $('#tok').onclick=async()=>{keep();const m=$('#tm');m.classList.remove('show');if(!pre.kinds.length){m.textContent='Tick at least one quest.';m.classList.add('show');return}
   if(pre.ids&&!pre.ids.length){m.textContent='Choose at least one child.';m.classList.add('show');return}
   const row={grade:g,class_name:pre.ids?'':pre.class_name,student_ids:pre.ids||[],land:$('#tl').value,stop:+$('#ts').value,kinds:pre.kinds,note:pre.note.trim(),due:pre.due||null,created_by:USER?USER.email:''};
   const {data,error}=await sb.from('mq_tasks').insert(row).select();if(error){m.textContent='Could not save the task.';m.classList.add('show');return}TASKS.unshift(data[0]);$('#modal').innerHTML='';render();toast('Task set ✓')}};
 draw()}
async function suggestModal(){const grades=[...new Set(KIDS.map(k=>k.grade))].sort();if(!grades.length){toast('Add children first');return}
 const opts=[];CLASSES.forEach(c=>opts.push({label:'Class '+c.name,grade:c.grade,cls:c.name}));grades.forEach(g=>opts.push({label:'All of '+GL(g),grade:g,cls:null}));let sel=0;
 const draw=async()=>{const o=opts[sel],cont=await content(o.grade),kids=KIDS.filter(k=>k.grade===o.grade&&(!o.cls||k.class_name===o.cls));
  const sug=[];cont.lands.forEach(l=>l.stops.forEach(st=>{const tr=[],lea=[];kids.forEach(k=>{const A=analyse(k,cont),s=A.find(x=>x.code===l.code).stops.find(x=>x.n===st.n);if(s.s==='tricky')tr.push(k);else if(s.s==='learning')lea.push(k)});if(tr.length)sug.push({l,st,kids:tr,why:'tricky'});else if(lea.length>=Math.max(2,kids.length/2))sug.push({l,st,kids:lea,why:'learning'})}));
  sug.sort((a,b)=>(a.why==='tricky'?0:1)-(b.why==='tricky'?0:1)||b.kids.length-a.kids.length);
  $('#modal').innerHTML=`<div class="modal"><div class="card" style="max-width:700px"><h2 style="color:var(--sea)">✨ Suggested tasks</h2><p class="muted small">Based on what children find tricky, or have started but not finished.</p>
   <select id="sgo" style="width:auto;margin:8px 0">${opts.map((x,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(x.label)}</option>`).join('')}</select>
   ${sug.length?sug.slice(0,8).map((x,i)=>`<div class="tk"><div class="row"><span style="font-size:24px">${LANDE[x.l.code]}</span><div style="flex:1"><b>${esc(x.st.topic)}</b> <span class="small muted">· ${esc(x.l.name)}</span><div class="small">${x.why==='tricky'?'🔴 Tricky for':'🟡 Still learning:'} ${x.kids.map(k=>esc(k.first_name)).join(', ')}</div></div><button class="b1 sm" data-sg="${i}">Assign to ${x.kids.length===1?esc(x.kids[0].first_name):'these '+x.kids.length}</button>${o.cls?`<button class="b2 sm" data-sgc="${i}">Whole class</button>`:''}</div></div>`).join(''):'<p class="muted">No suggestions yet — suggestions appear once children have answered some questions.</p>'}
   <div class="row" style="margin-top:12px"><div class="spacer"></div><button class="b2" id="sgx">Close</button></div></div></div>`;
  $('#sgx').onclick=()=>$('#modal').innerHTML='';$('#sgo').onchange=e=>{sel=+e.target.value;draw()};
  const due=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  document.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{const x=sug[+b.dataset.sg];taskModal({grade:o.grade,land:x.l.code,stop:x.st.n,ids:x.kids.map(k=>k.id),kinds:['learn','practise'],due})});
  document.querySelectorAll('[data-sgc]').forEach(b=>b.onclick=()=>{const x=sug[+b.dataset.sgc];taskModal({grade:o.grade,land:x.l.code,stop:x.st.n,class_name:o.cls,kinds:['learn','practise'],due})})};
 draw()}

function printCards(){const list=visible();if(!list.length){toast('No children to print');return}
 $('#cards').innerHTML=`<div class="cards">${list.map(c=>`<div class="ccard"><svg viewBox="0 0 64 64" style="width:40px;height:40px"><use href="#logo"/></svg><div class="f" style="color:var(--sea);font-size:18px">Maths Quest</div><div class="n">${esc(c.first_name)}</div><div style="font-size:13px">${GL(c.grade)}${c.class_name?' · '+esc(c.class_name):''}</div><div style="font-size:12px;margin-top:6px">Your secret explorer code</div><div class="cd">${fmtCode(c.code)}</div><div style="font-size:12px">Go to <b>${esc(location.host)}/play.html</b> and type your code. Happy exploring! 🧭</div></div>`).join('')}</div>`;setTimeout(()=>window.print(),150)}
start();
</script>
