 if(a.pet==='pet-bee')o+=`<g transform="translate(100 22)"><ellipse cx="-4" cy="-7" rx="6" ry="4" fill="#E6F4FF"/><ellipse cx="4" cy="-7" rx="6" ry="4" fill="#E6F4FF"/><ellipse cx="0" cy="0" rx="11" ry="8" fill="#FFD54A" stroke="#3B2F2F" stroke-width="1.5"/><rect x="-4" y="-7" width="3" height="14" fill="#2A2230"/><rect x="3" y="-7" width="3" height="14" fill="#2A2230"/><circle cx="8" cy="-1" r="1.5" fill="#2A2230"/></g>`;
 if(a.pet==='pet-cat')o+=`<g transform="translate(102 104)"><path d="M-10 -6 L-8 -17 L-2 -9 Z M10 -6 L8 -17 L2 -9 Z" fill="#FFB45C" stroke="#3B2F2F" stroke-width="1.5"/><circle cx="0" cy="0" r="11" fill="#FFB45C" stroke="#3B2F2F" stroke-width="1.5"/><ellipse cx="-4" cy="-1" rx="1.8" ry="2.2" fill="#2A2230"/><ellipse cx="4" cy="-1" rx="1.8" ry="2.2" fill="#2A2230"/><path d="M-2 4 Q0 6 2 4" fill="none" stroke="#2A2230" stroke-width="1.2"/></g>`;
 const r=round!==false;
 return `<svg class="avsvg" viewBox="0 0 120 120" width="${size}" height="${size}" role="img" aria-label="avatar">${r?`<clipPath id="${id}r"><circle cx="60" cy="60" r="60"/></clipPath><g clip-path="url(#${id}r)">${o}</g>`:o}</svg>`}


/* ideas for home: short, practical, no equipment needed */
const HOME={
 NI:['Read numbers you see together: prices, house numbers, car plates. Ask “what is 10 more? 10 less?”','Play “guess my number”: think of a number and answer only “bigger” or “smaller”.','Make number bonds with snacks or coins: how many ways can you make 10 (or 100)?'],
 TT:['Practise one times table for 5 minutes a day: chant it on the way to school, then ask facts out of order.','Count in steps while climbing stairs or clapping: 2s, 5s, 10s, then 3s and 4s.','Use arrays: arrange biscuits or buttons in rows and ask how many altogether.'],
 FF:['Share food fairly: cut a sandwich or pizza into halves, quarters or eighths and ask what fraction is left.','Fold paper into equal parts and colour some: which fraction is shaded?','Find fractions of amounts: “half of 12 grapes”, “a quarter of 20 dirhams”.'],
 MM:['Cook together: weigh and measure ingredients and read the scales.','Read the time on a clock face during the day, and work out “how long until…?”.','Pay with coins or notes in a shop and count the change together.'],
 SF:['Go on a shape hunt at home: count sides and corners, and look for right angles.','Build 3D shapes from boxes and cans: how many faces, edges and corners?','Give directions to find a hidden toy: forwards, left, right, quarter turn.'],
 DD:['Make a tally of family favourites (fruit, colours, sports) and draw a quick bar chart together.','Look at a chart in a newspaper or on a food packet and ask questions about it.','Keep a weather or bedtime chart for a week and talk about what it shows.'],
 PP:['Spot patterns: “what comes next?” with number sequences, and explain the rule.','Talk about discounts in shops: “20% off 50 dirhams, what is the new price?”','Share sweets in a ratio, e.g. 2 for you and 1 for me. How many each from 12?']};
let D=null,C=null,NC={};
function view(){if(!D)return signin();report()}
function signin(m){$('#app').innerHTML=`<div class="card center" style="max-width:560px;margin:30px auto"><svg viewBox="0 0 64 64" style="width:70px;height:70px"><use href="#logo"/></svg>
 <h1 style="font-size:32px;margin:8px 0">Your child’s maths journey</h1><p class="muted">Type your child’s Maths Quest code to see their progress and what to practise at home this week.</p>
 <form id="pf"><input id="pc" autocomplete="off" autocapitalize="characters" placeholder="e.g. 7KQ-2MP" maxlength="9" aria-label="Your child's code"><div class="bad" id="pm" style="min-height:22px;margin:8px 0">${m?esc(m):''}</div><button class="btn b1">See progress →</button></form>
 <p class="small muted" style="margin-top:16px">This page only shows progress. It does not count as your child playing. The code is on the card your child’s teacher gave them.</p></div>`;
 $('#pf').onsubmit=async e=>{e.preventDefault();const v=$('#pc').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(v.length<6){$('#pm').textContent='The code has 6 letters and numbers.';return}await open(v)}}
async function open(code){$('#pm')&&($('#pm').textContent='Loading…');let r={data:null,error:{}};try{r=await sb.rpc('mq_parent',{p_code:code})}catch(e){}
 if(r.error&&!r.data){signin('Could not connect. Please try again.');return}if(!r.data){signin('We could not find that code. Please check it with your child’s teacher.');return}
 if(r.data.error==='paused'){signin('Maths Quest is paused for this school at the moment.');return}
 D=r.data;D.code=code;try{sessionStorage.setItem('mq-parent',code)}catch(e){}
 const pg=D.support&&D.support.play_grade!=null&&D.support.play_grade!==''?+D.support.play_grade:D.grade;D.pg=pg;
 try{const [c,n]=await Promise.all([fetch(`content/grade${pg}.json`).then(x=>x.json()),fetch('content/nc.json').then(x=>x.json()).catch(()=>({}))]);C=c;NC=n}catch(e){C={lands:[]}}view()}
function stats(){const f=D.facts||{},w=D.wrong||{},done=D.done||{};
 return C.lands.map(L=>({L,stops:L.stops.map(st=>{const kinds=QK.concat(st.listen&&st.listen.length?['listen']:[]);const qd=kinds.filter(k=>done[`G${D.pg}-${L.code}-${st.n}-${k}`]).length;
  const pre=`${L.code}${D.pg}-${st.n}-`;let r=0,x=0;for(const k in f)if(k.startsWith(pre))r+=f[k];for(const k in w)if(k.startsWith(pre))x+=w[k];const n=r+x,acc=n?r/n:null;
  let s='new';if(qd||n)s='learning';if(n>=5&&acc<.6)s='tricky';else if(qd===kinds.length&&(acc===null||acc>=.75))s='secure';else if(n>=10&&acc>=.85&&qd>=2)s='secure';
  return {st,qd,qt:kinds.length,n,x,acc,s,need:x*2+(acc!==null&&n>=3?(1-acc)*20:0)}})}))}
function report(){const S=stats(),all=S.flatMap(l=>l.stops),td=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai'}).format(new Date());
 const ws=(()=>{const d=new Date(td+'T12:00:00Z'),w=(d.getUTCDay()+6)%7;return new Date(d.getTime()-w*864e5)})();const wk=[...Array(7)].map((_,i)=>new Date(ws.getTime()+i*864e5).toISOString().slice(0,10));
 const doneDays=new Set(Object.values(D.done||{}).filter(x=>typeof x==='string'));const act=d=>!!(D.days||{})[d]||doneDays.has(d);
 const wa=wk.reduce((a,d)=>a+(+((D.days||{})[d]||[0])[0]||0),0),wc=wk.reduce((a,d)=>a+(+((D.days||{})[d]||[0,0])[1]||0),0),wq=Object.values(D.done||{}).filter(d=>typeof d==='string'&&d>=wk[0]).length;
 const qd=all.reduce((a,s)=>a+s.qd,0),qt=all.reduce((a,s)=>a+s.qt,0);
 const strong=all.filter(s=>s.s==='secure').slice(-4);
 let focus=all.filter(s=>s.s==='tricky'||(s.x>=2)).sort((a,b)=>b.need-a.need).slice(0,2);let why='These are the topics your child found trickiest recently.';
 if(!focus.length){focus=all.filter(s=>s.s==='learning').slice(0,2);why='Your child is working on these topics now.'}
 if(!focus.length){focus=all.filter(s=>s.s==='new').slice(0,2);why='These are the next topics on your child’s map.'}
 const landOf=s=>S.find(l=>l.stops.includes(s)).L;
 const badges=S.filter(l=>l.stops.length&&l.stops.every(s=>s.qd===s.qt));const champ={};for(const k in D.done||{}){const m=k.match(/^G\d-([A-Z]{2})-C-(\d)$/);if(m)champ[m[1]]=Math.max(champ[m[1]]||0,+m[2])}
 const finished=S.length&&badges.length===S.length;const streak=(D.streak_day&&D.streak_day>=wk[0]&&D.streak)||0;
 const ck=(D.checks||[]).filter(c=>c.n);const pct=c=>c.n?Math.round(100*c.ok/c.n):null;
 const tipIdx=Math.floor(Date.parse(wk[0])/6048e5);
 $('#app').innerHTML=`<div class="card"><div class="hero">${avatarSVG(D.avatar,96)}<div style="flex:1;min-width:200px"><h1 style="font-size:32px">${esc(D.first_name)}’s maths journey</h1><div class="muted">${GRADE[D.grade]||''}${D.class_name?' · '+esc(D.class_name):''} · ${esc(D.school||'')}</div>
   <div class="muted small" style="margin-top:4px">Last played: ${D.last_seen?ago(D.last_seen):'not yet'}</div></div><div class="noprint"><button class="btn b2" id="pp">🖨 Print</button> <button class="btn b2" id="po">Another child</button></div></div></div>
 <div class="grid2"><div class="card"><h2>📅 This week</h2><div class="week">${wk.map(d=>`<span><i class="${act(d)?'on':''}"></i>${new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short'})}</span>`).join('')}</div>
   <div class="grid3" style="margin-top:12px"><div class="stat"><b>${wq}</b>quests done</div><div class="stat"><b>${wa}</b>questions answered</div><div class="stat"><b>${wa?Math.round(100*wc/wa)+'%':'—'}</b>correct</div></div>
   <p class="small muted" style="margin:10px 0 0">${streak?`🔥 On a ${streak}-day streak!`:'A little every day helps most: 2 quests a day lights the streak flame.'}</p></div>
  <div class="card"><h2>⭐ Achievements</h2><div style="margin-top:8px"><span class="badge">⭐ ${D.stars} stars</span><span class="badge">🔥 Best streak: ${D.best_streak||0} days</span>${D.speed&&D.speed.best!=null?`<span class="badge">⚡ Beat the clock best: ${D.speed.best}</span>`:''}${badges.map(l=>`<span class="badge">🏅 ${esc(l.L.name)}</span>`).join('')}${Object.entries(champ).map(([c,n])=>`<span class="badge">${'⭐'.repeat(n)} ${esc((C.lands.find(l=>l.code===c)||{}).name||c)} Champion</span>`).join('')}${finished?'<span class="badge" style="background:#FFF3C4;border-color:#FFC93C">🏆 Grand Treasure found!</span>':''}</div>
   ${finished?'<p class="small">Your child can print their certificate from the Grand Treasure page on their map.</p>':''}</div></div>
 <div class="card"><h2>🏡 Practise at home this week</h2><p class="muted" style="margin:4px 0 0">${why}</p>
  ${focus.map((s,i)=>{const L=landOf(s),nc=NC[`${D.pg}-${L.code}-${s.st.n}`],ideas=HOME[L.code]||[];return `<div class="tip"><h3>${esc(s.st.topic)}</h3><div class="obj">${esc(L.name)}${nc?' · National Curriculum '+esc(nc.y)+': '+esc(nc.o):''}</div>
   <ul class="cl"><li>${esc(ideas[(tipIdx+i*2)%ideas.length]||'')}</li><li>${esc(ideas[(tipIdx+i*2+1)%ideas.length]||'')}</li><li>On Maths Quest, open <b>${esc(L.name)}</b> and do the <b>📖 Learn it</b> and <b>✏️ Practise it</b> quests for this stop. If an answer is wrong, tap <b>💡 Show me how</b> together.</li></ul></div>`}).join('')||'<p>Keep exploring the map together!</p>'}
  <p class="small muted">Ten minutes a day is plenty. Praise effort and good thinking, not just right answers.</p></div>
 <div class="card"><h2>🗺️ Progress through the lands</h2><div style="margin-top:6px">${S.map(l=>{const d=l.stops.reduce((a,s)=>a+s.qd,0),t=l.stops.reduce((a,s)=>a+s.qt,0);return `<div class="land"><img src="img/land/${LIMG[l.L.code]}.webp" alt=""><div style="width:170px"><b>${esc(l.L.name)}</b><div class="small muted">${l.stops.filter(s=>s.s==='secure').length} of ${l.stops.length} topics secure</div></div><div class="bar"><i style="width:${t?Math.round(100*d/t):0}%"></i></div><b style="width:48px;text-align:right">${t?Math.round(100*d/t):0}%</b></div>`}).join('')}</div>
  <p class="small muted" style="margin:8px 0 0">Overall: ${qd} of ${qt} quests done${D.answered?` · ${Math.round(100*D.correct/D.answered)}% of all answers correct`:''}.</p></div>
 <div class="grid2"><div class="card"><h2>💪 Going well</h2>${strong.length?`<ul class="cl">${strong.map(s=>`<li><b>${esc(s.st.topic)}</b> <span class="muted small">· ${esc(landOf(s).name)}</span></li>`).join('')}</ul>`:'<p class="muted">Strengths will show here as your child completes quests.</p>'}</div>
  <div class="card"><h2>📋 Maths checks</h2>${ck.length?ck.map((c,i)=>{const p=pct(c),pr=i?pct(ck[i-1]):null;return `<div style="display:flex;justify-content:space-between;border-top:1px solid #F1EAD8;padding:8px 0"><span><b>${esc(c.name)}</b><div class="small muted">${new Date(c.at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}${c.done?'':' · in progress'}</div></span><b class="f" style="font-size:22px;color:var(--sea)">${p}%${pr!==null&&c.done?` <span style="font-size:14px;color:${p>=pr?'#1E7B4E':'#B23A1E'}">${p>pr?'▲ +':p<pr?'▼ ':''}${p-pr}%</span>`:''}</b></div>`}).join(''):'<p class="muted">Your child’s teacher runs short checks during the year. Results will appear here.</p>'}</div></div>`;
 $('#pp').onclick=()=>window.print();$('#po').onclick=()=>{D=null;try{sessionStorage.removeItem('mq-parent')}catch(e){}view()}}
function ago(t){const d=Math.floor((Date.now()-Date.parse(t))/864e5);return d<=0?'today':d===1?'yesterday':d+' days ago'}
(async()=>{let c=null;try{c=sessionStorage.getItem('mq-parent')}catch(e){}const q=new URLSearchParams(location.search).get('code');if(q)c=q.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c){$('#app').innerHTML='<p class="center muted">Loading…</p>';await open(c)}else view()})();
